name: Publish release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish annotated version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.message' > release-notes.md
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
            --verify-tag --notes-file release-notes.md --title "$RELEASE_TAG" --latest
