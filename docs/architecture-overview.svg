<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Project Dolores — Dual-Helix Cognition</title>
<desc id="desc">Full frozen life context generates a Plan. Current messages and Plan build world context. Staged thoughts yield fixed expressions, private silence, send, store, duplicate or discard. Canonical indexed raw diary feeds six independent Reflection jobs. Mechanical gates preserve KEEP and frozen recovery inputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8dc8df"/></marker></defs>
<rect width="1120" height="640" rx="18" fill="#111b2b"/>
<g font-family="system-ui,sans-serif" fill="#e9eff7"><text x="40" y="48" font-size="26" font-weight="700">PROJECT DOLORES · DUAL-HELIX COGNITION</text><text x="40" y="78" font-size="15" fill="#aabbd0">Current execution contract · independent jobs · private installed runtime</text></g>
<g fill="#1b3045" stroke="#5fb7da" stroke-width="2"><rect x="40" y="115" width="260" height="110" rx="12"/><rect x="370" y="115" width="260" height="110" rx="12"/><rect x="700" y="115" width="375" height="110" rx="12"/><rect x="40" y="300" width="1035" height="100" rx="12"/><rect x="40" y="475" width="300" height="120" rx="12"/><rect x="390" y="475" width="685" height="120" rx="12"/></g>
<g font-family="system-ui,sans-serif" fill="#e9eff7" font-size="18"><text x="60" y="145" font-weight="700">1 · Frozen life context</text><text x="60" y="175" font-size="15">Narratives · seven cards · diary</text><text x="60" y="200" font-size="15">Thoughts · Loops · interests · weather</text><text x="390" y="145" font-weight="700">2 · Plan → world context</text><text x="390" y="175" font-size="15">One day imagined as a whole</text><text x="390" y="200" font-size="15">Current messages override the prior</text><text x="720" y="145" font-weight="700">3 · Context bridge</text><text x="720" y="175" font-size="15">Startup receipt + affect read</text><text x="720" y="200" font-size="15">Validated context-sync → conversation</text><text x="60" y="330" font-weight="700">4 · Heartbeat cognition · separate tool stages</text><text x="60" y="365" font-size="17">Scene + affect + frozen Loop body → thought → fixed draft → ownership → function / timing gate</text><text x="60" y="510" font-weight="700">5 · Indexed raw diary</text><text x="60" y="540" font-size="15">Atomic append · facts + local italics</text><text x="60" y="568" font-size="15">Actors · chronology · knowledge</text><text x="410" y="510" font-weight="700">6 · Independent Reflection</text><text x="410" y="540" font-size="15">Cards · Prep · Plan · Self · Relationship · Profile</text><text x="410" y="568" font-size="15">KEEP restored · current self isolated · original Plan input retained</text></g>
